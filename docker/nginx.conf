# Serves the built app and proxies /api, as the Vite dev server does.
# This container shares the api container's network, so the services are on 127.0.0.1.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cross-origin isolation for the threaded ONNX runtime (see vite.config.ts).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Like server/api/proxy.ts: a caller's X-Forwarded-* are replaced, never relayed,
    # because the API trusts this hop (TRUST_PROXY=loopback).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";

    location /api/auth   { proxy_pass http://127.0.0.1:4319; }
    location /api/admin  { proxy_pass http://127.0.0.1:4319; }
    location /api/health { proxy_pass http://127.0.0.1:4319; }

    # The chord agent drives a browser, so its requests can take minutes.
    location /api/ug {
        proxy_pass http://127.0.0.1:4318;
        proxy_read_timeout 600s;
        client_max_body_size 10m;
    }

    location /api/ { return 404; }

    location = /index.html { add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always; }
    location / { try_files $uri $uri/ /index.html; }
}
