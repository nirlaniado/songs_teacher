name: ci

# Fast loop for agent task branches: prove it installs, typechecks and passes tests
# on a clean machine before a reviewer seat is ever dispatched.

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
