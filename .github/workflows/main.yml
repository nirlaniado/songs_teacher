name: main

# Merge gate. Runs on the PR, which is what branch protection can require --
# a push-to-main workflow would only report a mistake already made.
# `npm run build` runs typecheck itself, so it is not repeated as a separate step.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
